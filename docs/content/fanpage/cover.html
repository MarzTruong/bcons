<!doctype html><html lang="vi"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1640px;height:624px;overflow:hidden;position:relative;color:#fff;font-family:'Be Vietnam Pro',Inter,'DejaVu Sans',sans-serif;
 background:
  radial-gradient(900px 340px at 50% 100%,rgba(242,182,109,.55),rgba(242,182,109,0) 70%),
  linear-gradient(180deg,#081a2e 0%,#0c3049 55%,#16546a 100%)}
svg{position:absolute;inset:0}
.t{position:absolute;left:0;right:0;top:56px;text-align:center}
.e{font-size:23px;letter-spacing:7px;text-transform:uppercase;color:#f2c58f;font-weight:600}
h1{font-size:78px;line-height:1.1;font-weight:700;margin-top:18px;letter-spacing:-.5px}

</style></head><body>
<svg id="s" width="1640" height="624" viewBox="0 0 1640 624"></svg>
<div class="t"><div class="e">236 Phan Trung · Tam Hiệp · Biên Hòa</div>
<h1>Căn hộ Phan Trung<span>Bcons Central Park</span></h1></div>
<script>
const NS='http://www.w3.org/2000/svg', s=document.getElementById('s');
let seed=7; const rnd=()=> (seed=(seed*16807)%2147483647)/2147483647;
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||s).appendChild(e);return e}
const defs=el('defs',{});
const g=el('linearGradient',{id:'tw',x1:0,y1:0,x2:0,y2:1},defs);
el('stop',{offset:'0','stop-color':'#12374f'},g);el('stop',{offset:'1','stop-color':'#071522'},g);
const W=150,GAP=36,H=[196,248,292,232,186], x0=(1640-(5*W+4*GAP))/2, base=584;
H.forEach((h,i)=>{
  const x=x0+i*(W+GAP), y=base-h;
  el('rect',{x,y,width:W,height:h,fill:'url(#tw)'});
  el('rect',{x,y,width:W,height:3,fill:'#2f7899'});
  for(let r=0;r<Math.floor((h-24)/26);r++)for(let c=0;c<7;c++){
    const lit=rnd()<.34;
    el('rect',{x:x+12+c*19.5,y:y+16+r*26,width:9,height:14,rx:1.5,fill:lit?'#f6c98b':'#1a4560','fill-opacity':lit?(.55+rnd()*.4):.9});
  }
});
el('rect',{x:0,y:base,width:1640,height:40,fill:'#05111c'});
el('rect',{x:0,y:base,width:1640,height:2,fill:'#2f7899','fill-opacity':.6});
</script></body></html>
