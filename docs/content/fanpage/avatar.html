<!doctype html><html lang="vi"><head><meta charset="utf-8"><style>
*{margin:0;padding:0}body{width:1080px;height:1080px;overflow:hidden;background:radial-gradient(700px 520px at 50% 100%,rgba(242,182,109,.5),rgba(242,182,109,0) 70%),linear-gradient(180deg,#081a2e,#13506a)}svg{display:block}
</style></head><body><svg id="s" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
<script>
const NS='http://www.w3.org/2000/svg', s=document.getElementById('s');
let seed=11; const rnd=()=> (seed=(seed*16807)%2147483647)/2147483647;
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||s).appendChild(e);return e}
const defs=el('defs',{});const g=el('linearGradient',{id:'b',x1:0,y1:0,x2:0,y2:1},defs);
el('stop',{offset:'0','stop-color':'#ffffff'},g);el('stop',{offset:'1','stop-color':'#a9cadd'},g);
const W=92,GAP=26,H=[250,330,420,310,230],x0=(1080-(5*W+4*GAP))/2,base=790;
H.forEach((h,i)=>{const x=x0+i*(W+GAP),y=base-h;
 el('rect',{x,y,width:W,height:h,rx:8,fill:'url(#b)'});
 for(let r=0;r<Math.floor((h-30)/34);r++)for(let c=0;c<3;c++){const lit=rnd()<.45;
  el('rect',{x:x+14+c*25,y:y+22+r*34,width:13,height:19,rx:2,fill:lit?'#e9a85a':'#7ea6bd','fill-opacity':lit?.95:.55});}
});
el('rect',{x:x0-30,y:base,width:5*W+4*GAP+60,height:8,rx:4,fill:'#f2c58f'});
</script></body></html>
